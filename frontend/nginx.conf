# Serves the SPA and proxies /api to the backend, so the browser sees one origin.
upstream backend {
  server backend:3000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # JSON API requests are small; CSV imports get their own, larger limit below.
  client_max_body_size 2m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API responses carry the backend's own security headers (helmet), so none are added here.
  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Appends the address this nginx saw. The backend trusts this hop plus TRUST_PROXY hops.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Internal-Key "";
    proxy_read_timeout 120s;
  }

  # A 5 MB bank CSV travels as JSON text (quotes escaped), plus the row decisions.
  location /api/import/ {
    client_max_body_size 15m;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Internal-Key "";
    proxy_read_timeout 300s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The reset link carries a one-time token in its query string: keep it out of the access log.
  location = /reset-password {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
